<script>
(function () {
  'use strict';

  var T = WTT.t;
  function $(sel) { return document.querySelector(sel); }
  function h(tag, props, kids) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      if (props[k] === undefined || props[k] === null || props[k] === false) return;
      if (k === 'text') e.textContent = props[k]; else if (k === 'class') e.className = props[k]; else e.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(new Error(WTT.errorText(err))); });
      runner[fn].apply(runner, args);
    });
  }

  var btnStart = $('#btn-start');
  var btnPause = $('#btn-pause');
  var btnResume = $('#btn-resume');
  var btnFinish = $('#btn-finish');
  var timerDisplay = $('#timer-display');
  var statusEl = $('#status');
  var taskTitle = $('#task-title');

  var state = null;
  var fetchedAt = 0;
  var tickHandle = null;

  function setStatus(msg, kind) {
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
    statusEl.textContent = msg || '';
  }
  function stopTicking() { if (tickHandle) { clearInterval(tickHandle); tickHandle = null; } }
  function startTicking() { stopTicking(); tickHandle = setInterval(renderTimer, 1000); renderTimer(); }

  function renderTimer() {
    if (!state || !state.activeTask) { timerDisplay.textContent = '00:00:00'; return; }
    var base = Number(state.totalMsForActiveTask) || 0;
    var extra = state.activeSession ? (Date.now() - fetchedAt) : 0;
    timerDisplay.textContent = WTT.fmtMs(base + extra);
  }

  function renderButtons() {
    btnStart.hidden = btnPause.hidden = btnResume.hidden = btnFinish.hidden = true;
    if (!state || !state.activeTask) return;
    if (state.activeSession) { btnPause.hidden = false; btnFinish.hidden = false; return; }
    var hasPrior = (state.sessions || []).some(function (s) { return s.taskId === state.activeTask.id; });
    if (hasPrior) btnResume.hidden = false; else btnStart.hidden = false;
    btnFinish.hidden = false;
  }

  function renderTaskTitle() {
    taskTitle.removeAttribute('data-i18n');
    taskTitle.textContent = (!state || !state.activeTask) ? T('ws.noTask') : state.activeTask.title;
  }

  function renderHistory() {
    var table = $('#history-table'), empty = $('#history-empty');
    $('#history-loading').hidden = true;
    var sessions = (state && state.sessions) || [];
    if (!sessions.length) { table.hidden = true; empty.hidden = false; return; }
    empty.hidden = true;
    var taskById = {};
    (state.tasks || []).forEach(function (t) { taskById[t.id] = t; });
    var tbody = table.querySelector('tbody');
    while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
    sessions.slice().sort(function (a, b) { return a.startTime < b.startTime ? 1 : -1; }).forEach(function (s) {
      var dur = Number(s.durationMs) || 0;
      if (s.status === 'active') dur = Date.now() - new Date(s.startTime).getTime();
      var task = taskById[s.taskId];
      tbody.appendChild(h('tr', {}, [
        h('td', { 'data-label': T('col.task'), text: task ? task.title : T('common.unknown') }),
        h('td', { 'data-label': T('col.start'), text: WTT.fmtDateTime(s.startTime) }),
        h('td', { 'data-label': T('col.end'), text: WTT.fmtDateTime(s.endTime) }),
        h('td', { 'data-label': T('col.duration'), text: WTT.fmtMs(dur) }),
        h('td', { 'data-label': T('col.status') }, [h('span', { class: 'pill ' + s.status, text: T('status.' + s.status) })])
      ]));
    });
    table.hidden = false;
  }

  function renderAll() {
    renderTaskTitle(); renderButtons(); renderHistory();
    if (state && state.activeSession) startTicking(); else { stopTicking(); renderTimer(); }
  }

  function refresh() {
    return call('api_getEmployeeState', WORKSPACE_TOKEN).then(function (s) {
      state = s;
      fetchedAt = Date.now();
      renderAll();
      setStatus('');
    }).catch(function (err) {
      $('#history-loading').hidden = true;
      taskTitle.removeAttribute('data-i18n');
      taskTitle.textContent = T('ws.unavailable');
      setStatus(err.message, 'error');
    });
  }

  function action(fn, labelKey) {
    setStatus(T(labelKey));
    [btnStart, btnPause, btnResume, btnFinish].forEach(function (b) { b.disabled = true; });
    return call(fn, WORKSPACE_TOKEN).then(function () { return refresh(); }).catch(function (err) {
      setStatus(err.message, 'error');
    }).then(function () { [btnStart, btnPause, btnResume, btnFinish].forEach(function (b) { b.disabled = false; }); });
  }

  btnStart.addEventListener('click', function () { action('api_startSession', 'ws.starting'); });
  btnResume.addEventListener('click', function () { action('api_resumeSession', 'ws.resuming'); });
  btnPause.addEventListener('click', function () { action('api_pauseSession', 'ws.pausing'); });
  btnFinish.addEventListener('click', function () {
    if (!confirm(T('ws.finishConfirm'))) return;
    action('api_finishTask', 'ws.finishing');
  });

  WTT.onChange(function () { if (state) renderAll(); });

  function boot(urlLang) {
    WTT.init(urlLang);
    refresh();
    // Resync every minute so changes a manager makes show up without a reload.
    setInterval(refresh, 60000);
  }
  try {
    google.script.url.getLocation(function (loc) { boot(loc && loc.parameter && loc.parameter.lang && String(loc.parameter.lang)); });
  } catch (e) { boot(null); }
})();
</script>
