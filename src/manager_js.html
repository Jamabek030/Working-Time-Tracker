<script>
(function () {
  'use strict';

  var T = WTT.t;
  var S = { employees: [], dash: null, detail: null, report: null, info: null, lastCsv: '' };

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  // All DOM is built with textContent: user-controlled text (names, emails,
  // task titles) is never parsed as HTML.
  function h(tag, props, kids) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === undefined || v === null || v === false) return;
      if (k === 'text') e.textContent = v;
      else if (k === 'class') e.className = v;
      else if (k === 'on') Object.keys(v).forEach(function (ev) { e.addEventListener(ev, v[ev]); });
      else e.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function setStatus(el, kind, text) { el.className = 'status' + (kind ? ' ' + kind : ''); el.textContent = text || ''; }
  function fullName(e) { return [e.lastName, e.firstName, e.middleName].filter(Boolean).join(' '); }
  function pill(kind, text) { return h('span', { class: 'pill ' + kind, text: text }); }
  function statePill(state) { return pill('st-' + state, T('state.' + state)); }
  function statusPill(status) { return pill(status || 'none', status ? T('status.' + status) : '—'); }
  function utcToday() { return new Date().toISOString().slice(0, 10); }
  function utcDaysAgo(n) { return new Date(Date.now() - n * 86400000).toISOString().slice(0, 10); }

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(new Error(WTT.errorText(err))); });
      runner[fn].apply(runner, args);
    });
  }

  function td(label, content) {
    var cell = h('td', { 'data-label': label });
    if (content !== null && content !== undefined) cell.appendChild(typeof content === 'string' ? document.createTextNode(content) : content);
    return cell;
  }
  function th(key) { return h('th', { text: T(key) }); }

  // ---------- Tabs ----------
  function showTab(name) {
    $$('.tab').forEach(function (b) {
      var on = b.getAttribute('data-tab') === name;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.setAttribute('tabindex', on ? '0' : '-1');
    });
    $$('.tab-panel').forEach(function (p) { p.classList.toggle('active', p.id === 'tab-' + name); });
    if (name === 'dashboard') loadDashboard();
  }
  $$('.tab').forEach(function (b) {
    b.addEventListener('click', function () { showTab(b.getAttribute('data-tab')); });
    b.addEventListener('keydown', function (ev) {
      var tabs = $$('.tab'), i = tabs.indexOf(b), n = null;
      if (ev.key === 'ArrowRight') n = tabs[(i + 1) % tabs.length];
      if (ev.key === 'ArrowLeft') n = tabs[(i + tabs.length - 1) % tabs.length];
      if (n) { ev.preventDefault(); n.focus(); showTab(n.getAttribute('data-tab')); }
    });
  });

  // ---------- Email capability ----------
  function renderEmailInfo() {
    var box = $('#email-info');
    var info = S.info;
    if (!info) { box.hidden = true; return; }
    var key, params;
    if (!info.email.enabled) key = 'mail.info.disabled';
    else if (!info.email.available) key = 'mail.info.unavailable';
    else { key = 'mail.info.ready'; params = { remaining: info.email.remaining }; }
    box.textContent = T(key, params);
    box.hidden = false;
  }

  function inviteText(inv) {
    if (!inv) return T('invite.none');
    var key = 'invite.' + inv.status;
    return T(key);
  }
  function inviteBadge(inv) {
    if (!inv) return pill('inv-none', T('invite.none'));
    var ok = inv.status === 'sent';
    var bad = inv.status === 'failed' || inv.status === 'unavailable';
    return pill(ok ? 'inv-ok' : (bad ? 'inv-bad' : 'inv-warn'), T('invite.' + inv.status));
  }

  // ---------- Dashboard ----------
  var dashForm = $('#dash-form');
  dashForm.from.value = utcDaysAgo(6);
  dashForm.to.value = utcToday();
  dashForm.addEventListener('submit', function (ev) { ev.preventDefault(); loadDashboard(); });

  function loadDashboard() {
    var status = $('#dash-status');
    setStatus(status, '', T('common.loading'));
    call('api_getDashboard', dashForm.from.value, dashForm.to.value).then(function (d) {
      S.dash = d;
      setStatus(status, '', '');
      renderDashboard();
    }).catch(function (err) { setStatus(status, 'error', err.message); });
  }

  function renderDashboard() {
    var d = S.dash;
    if (!d) return;
    $('#m-total').textContent = d.metrics.totalEmployees;
    $('#m-working').textContent = d.metrics.working;
    $('#m-paused').textContent = d.metrics.paused;
    $('#m-active-tasks').textContent = d.metrics.activeTasks;
    $('#m-done-tasks').textContent = d.metrics.completedTasks;
    $('#m-tracked').textContent = WTT.fmtMs(d.metrics.trackedMs);

    var chart = $('#chart');
    clear(chart);
    var max = 0;
    d.daily.forEach(function (x) { if (x.ms > max) max = x.ms; });
    var hasData = max > 0;
    $('#daily-empty').hidden = hasData;
    chart.hidden = !hasData;
    $('#daily-table').hidden = !hasData;
    chart.setAttribute('aria-label', T('dash.chartLabel', { total: WTT.fmtMs(d.metrics.trackedMs), days: d.daily.length }));
    if (hasData) {
      d.daily.forEach(function (x) {
        var pct = Math.max(2, Math.round(x.ms / max * 100));
        chart.appendChild(h('div', { class: 'bar-col', title: x.date + ' — ' + WTT.fmtMs(x.ms) }, [
          h('div', { class: 'bar-val', text: x.ms ? WTT.fmtMs(x.ms).slice(0, 5) : '' }),
          h('div', { class: 'bar-track' }, [h('div', { class: 'bar' + (x.ms ? '' : ' zero'), style: 'height:' + (x.ms ? pct : 0) + '%' })]),
          h('div', { class: 'bar-label', text: WTT.fmtDate(x.date) })
        ]));
      });
    }
    var dt = $('#daily-table tbody');
    clear(dt);
    d.daily.forEach(function (x) {
      dt.appendChild(h('tr', {}, [td(T('col.date'), x.date), td(T('col.duration'), WTT.fmtMs(x.ms))]));
    });

    var be = $('#byemp-table tbody');
    clear(be);
    $('#byemp-empty').hidden = d.byEmployee.length > 0;
    $('#byemp-table').hidden = d.byEmployee.length === 0;
    d.byEmployee.forEach(function (x) {
      be.appendChild(h('tr', {}, [td(T('col.name'), x.name), td(T('col.duration'), WTT.fmtMs(x.ms))]));
    });
  }

  // ---------- Create employee ----------
  var createForm = $('#create-form');
  createForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var data = {};
    new FormData(createForm).forEach(function (v, k) { data[k] = v; });
    data.sendInvite = $('#send-invite').checked;
    data.lang = WTT.lang();
    var status = $('#create-status');
    setStatus(status, '', T('form.creating'));
    var btn = createForm.querySelector('button[type="submit"]');
    btn.disabled = true;
    call('api_createEmployee', data).then(function (res) {
      var name = [res.employee.lastName, res.employee.firstName].filter(Boolean).join(' ');
      var inv = res.invite;
      var bad = inv && (inv.status === 'failed' || inv.status === 'unavailable');
      var msg = T('form.created', { name: name }) + ' ' + T('invite.result.' + (inv ? inv.status : 'none'));
      setStatus(status, bad ? 'warn' : 'ok', msg);
      createForm.reset();
      $('#send-invite').checked = true;
      S.dash = null;
      loadEmployees();
    }).catch(function (err) {
      setStatus(status, 'error', err.message);
    }).then(function () { btn.disabled = false; });
  });

  // ---------- Employee list: search + filter happen in the browser ----------
  var searchInput = $('#emp-search');
  var filterSelect = $('#emp-filter');
  searchInput.addEventListener('input', renderEmployees);
  filterSelect.addEventListener('change', renderEmployees);

  function loadEmployees() {
    var loading = $('#employees-loading');
    setStatus(loading, '', T('common.loading'));
    loading.hidden = false;
    return call('api_listEmployees').then(function (list) {
      S.employees = list;
      loading.hidden = true;
      renderEmployees();
      populateReportEmployees();
    }).catch(function (err) { setStatus(loading, 'error', err.message); });
  }

  function renderEmployees() {
    var table = $('#employees-table'), empty = $('#employees-empty'), noRes = $('#employees-noresults');
    var count = $('#emp-count');
    if ($('#employees-loading').className.indexOf('error') >= 0) return;
    var list = window.WTT_FILTER(S.employees, searchInput.value, filterSelect.value);
    empty.hidden = S.employees.length > 0;
    $('#btn-sample').hidden = !(window.WTT_DEMO && S.employees.length === 0);
    noRes.hidden = !(S.employees.length > 0 && list.length === 0);
    table.hidden = list.length === 0;
    count.textContent = S.employees.length ? T('emp.count', { shown: list.length, total: S.employees.length }) : '';
    var tbody = $('tbody', table);
    clear(tbody);
    list.forEach(function (e) {
      var btn = h('button', { type: 'button', class: 'secondary small', text: T('emp.details'), 'aria-label': T('emp.detailsFor', { name: fullName(e) }), on: { click: function () { showDetails(e.id); } } });
      tbody.appendChild(h('tr', {}, [
        td(T('col.name'), fullName(e)),
        td(T('col.email'), e.email),
        td(T('col.status'), statePill(e.workState)),
        td(T('col.total'), WTT.fmtMs(e.totalMs)),
        td(T('col.invite'), inviteBadge(e.invite)),
        td('', btn)
      ]));
    });
  }

  $('#btn-sample').addEventListener('click', function () {
    var b = $('#btn-sample');
    b.disabled = true;
    call('api_loadDemoSample').then(function () { return loadEmployees(); }).catch(function (err) {
      setStatus($('#employees-empty'), 'error', err.message);
    }).then(function () { b.disabled = false; });
  });

  // ---------- Details ----------
  $('#details-close').addEventListener('click', function () { $('#details-card').hidden = true; S.detail = null; });

  function showDetails(id) {
    var card = $('#details-card'), content = $('#details-content');
    card.hidden = false;
    clear(content);
    content.appendChild(h('div', { class: 'status', text: T('common.loading') }));
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    call('api_getEmployeeDetails', id).then(function (d) {
      S.detail = d;
      renderDetails();
      $('#details-name').focus({ preventScroll: true });
    }).catch(function (err) {
      clear(content);
      content.appendChild(h('div', { class: 'status error', text: err.message }));
    });
  }

  function linkWithLang(url) {
    if (!url) return '';
    return url + (url.indexOf('lang=') < 0 ? '&lang=' + WTT.lang() : '');
  }

  function sessionMs(s) {
    if (s.status === 'active') return Math.max(0, Date.now() - new Date(s.startTime).getTime());
    return Number(s.durationMs) || 0;
  }

  function renderDetails() {
    var d = S.detail;
    if (!d) return;
    var content = $('#details-content');
    clear(content);
    $('#details-name').textContent = fullName(d.employee);
    var url = linkWithLang(d.workspaceUrl);

    // Summary
    content.appendChild(h('dl', { class: 'facts' }, [
      h('dt', { text: T('col.email') }), h('dd', { text: d.employee.email }),
      h('dt', { text: T('details.total') }), h('dd', {}, [h('strong', { text: WTT.fmtMs(d.totalMs) }), d.activeSession ? pill('active', T('details.running')) : null]),
      h('dt', { text: T('col.invite') }), h('dd', {}, [inviteBadge(d.invite), ' ', d.invite && d.invite.at ? h('span', { class: 'muted', text: WTT.fmtDateTime(d.invite.at) }) : null])
    ]));
    if (d.dataWarnings && d.dataWarnings.length) {
      content.appendChild(h('div', { class: 'status warn', text: T('details.warnings', { n: d.dataWarnings.length }) }));
    }

    // Workspace link (independent of email delivery)
    var linkInput = h('input', { type: 'text', readonly: true, class: 'mono link-input', value: url, id: 'ws-link', 'aria-label': T('details.workspaceLink') });
    var linkStatus = h('span', { class: 'muted', role: 'status', 'aria-live': 'polite' });
    var copyBtn = h('button', { type: 'button', class: 'secondary', text: T('details.copyLink'), on: { click: function () {
      var done = function () { linkStatus.textContent = T('details.copied'); };
      var fallback = function () { linkInput.focus(); linkInput.select(); linkStatus.textContent = T('details.copyManual'); };
      try { navigator.clipboard.writeText(url).then(done, fallback); } catch (e) { fallback(); }
    } } });
    var openLink = h('a', { class: 'btn secondary', href: url, target: '_blank', rel: 'noopener', text: T('details.openWorkspace') });
    var resendBtn = h('button', { type: 'button', class: 'secondary', text: d.invite && d.invite.status === 'sent' ? T('invite.resend') : (d.invite && d.invite.status ? T('invite.retry') : T('invite.send')) });
    var invStatus = h('div', { class: 'status', role: 'status', 'aria-live': 'polite' });
    resendBtn.addEventListener('click', function () {
      resendBtn.disabled = true;
      setStatus(invStatus, '', T('invite.sending'));
      call('api_resendInvitation', d.employee.id, WTT.lang()).then(function (res) {
        var bad = res.status === 'failed' || res.status === 'unavailable';
        setStatus(invStatus, bad ? 'warn' : 'ok', T('invite.result.' + res.status));
        return Promise.all([loadEmployees(), call('api_getEmployeeDetails', d.employee.id).then(function (nd) { S.detail = nd; })]).then(function () {
          // keep the result message visible after the panel is re-rendered
          renderDetails();
          setStatus($('#invite-status'), bad ? 'warn' : 'ok', T('invite.result.' + res.status));
        });
      }).catch(function (err) { setStatus(invStatus, 'error', err.message); }).then(function () { resendBtn.disabled = false; });
    });
    invStatus.id = 'invite-status';
    content.appendChild(h('h3', { text: T('details.workspaceLink') }));
    content.appendChild(h('div', { class: 'link-row' }, [linkInput, copyBtn, openLink]));
    content.appendChild(linkStatus);
    content.appendChild(h('p', { class: 'hint', text: T('details.linkNote') }));
    content.appendChild(h('div', { class: 'row-wrap' }, [resendBtn]));
    content.appendChild(invStatus);

    // Rotate token
    var rotateBtn = h('button', { type: 'button', class: 'warn', text: T('details.rotate'), on: { click: function () {
      if (!confirm(T('details.rotateConfirm'))) return;
      rotateBtn.disabled = true;
      call('api_rotateWorkspaceToken', d.employee.id).then(function () { showDetails(d.employee.id); }).catch(function (err) {
        rotateBtn.disabled = false;
        setStatus(invStatus, 'error', err.message);
      });
    } } });
    content.appendChild(h('div', { class: 'row-wrap' }, [rotateBtn]));

    // Assign task
    var input = h('input', { name: 'title', required: true, maxlength: '500', id: 'assign-title' });
    var formStatus = h('div', { class: 'status', role: 'status', 'aria-live': 'polite' });
    var submit = h('button', { type: 'submit', class: 'primary', text: T('details.assign') });
    var form = h('form', { class: 'assign' }, [
      h('label', { class: 'field grow' }, [h('span', { text: T('details.assignLabel') }), input]),
      h('div', { class: 'field actions' }, [submit])
    ]);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var title = input.value.trim();
      if (!title) return;
      submit.disabled = true;
      setStatus(formStatus, '', T('details.assigning'));
      call('api_assignTask', d.employee.id, title).then(function () {
        S.dash = null;
        showDetails(d.employee.id);
        loadEmployees();
      }).catch(function (err) { submit.disabled = false; setStatus(formStatus, 'error', err.message); });
    });
    content.appendChild(h('h3', { text: T('details.newTask') }));
    content.appendChild(form);
    content.appendChild(formStatus);

    // Task history with the sessions of each task
    content.appendChild(h('h3', { text: T('details.tasks') }));
    if (!d.tasks.length) {
      content.appendChild(h('div', { class: 'status', text: T('details.noTasks') }));
    } else {
      d.tasks.slice().sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; }).forEach(function (t) {
        var ss = d.sessions.filter(function (s) { return s.taskId === t.id; }).sort(function (a, b) { return a.startTime < b.startTime ? 1 : -1; });
        var total = ss.reduce(function (acc, s) { return acc + sessionMs(s); }, 0);
        var box = h('article', { class: 'task-card' }, [
          h('div', { class: 'task-head' }, [
            h('strong', { class: 'task-title', text: t.title }),
            statusPill(t.status),
            h('span', { class: 'muted', text: T('details.taskTotal', { time: WTT.fmtMs(total) }) })
          ]),
          h('div', { class: 'muted small', text: T('details.created') + ': ' + WTT.fmtDateTime(t.createdAt) + (t.completedAt ? ' · ' + T('details.closed') + ': ' + WTT.fmtDateTime(t.completedAt) : '') })
        ]);
        if (ss.length) {
          var tb = h('tbody');
          ss.forEach(function (s) {
            tb.appendChild(h('tr', {}, [
              td(T('col.start'), WTT.fmtDateTime(s.startTime)),
              td(T('col.end'), WTT.fmtDateTime(s.endTime)),
              td(T('col.duration'), WTT.fmtMs(sessionMs(s))),
              td(T('col.status'), statusPill(s.status))
            ]));
          });
          box.appendChild(h('div', { class: 'table-wrap' }, [h('table', { class: 'stack' }, [h('thead', {}, [h('tr', {}, [th('col.start'), th('col.end'), th('col.duration'), th('col.status')])]), tb])]));
        } else {
          box.appendChild(h('div', { class: 'muted small', text: T('details.noSessions') }));
        }
        content.appendChild(box);
      });
    }
  }

  // ---------- Reports ----------
  var reportForm = $('#report-form');
  reportForm.from.value = utcDaysAgo(29);
  reportForm.to.value = utcToday();

  function populateReportEmployees() {
    var sel = $('#report-employee');
    var keep = sel.value;
    clear(sel);
    sel.appendChild(h('option', { value: '', text: T('rep.allEmployees') }));
    S.employees.forEach(function (e) { sel.appendChild(h('option', { value: e.id, text: fullName(e) })); });
    sel.value = keep;
    if (sel.value !== keep) sel.value = '';
  }

  reportForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var status = $('#report-status');
    setStatus(status, '', T('rep.generating'));
    $('#report-content').textContent = '';
    $('#csv-fallback').hidden = true;
    var from = reportForm.from.value, to = reportForm.to.value;
    call('api_generateReport', from, to).then(function (rows) {
      S.report = { rows: rows, from: from, to: to };
      setStatus(status, '', '');
      $('#btn-csv').disabled = false;
      renderReport();
    }).catch(function (err) { S.report = null; $('#btn-csv').disabled = true; setStatus(status, 'error', err.message); });
  });
  $('#report-employee').addEventListener('change', function () { if (S.report) renderReport(); });

  function renderReport() {
    var r = S.report;
    var content = $('#report-content');
    var status = $('#report-status');
    clear(content);
    if (!r) return;
    var empId = $('#report-employee').value;
    var rows = r.rows.filter(function (x) { return !empId || x.employeeId === empId; });
    if (!rows.length) {
      setStatus(status, '', '');
      content.appendChild(h('div', { class: 'status', text: T('rep.empty') }));
      return;
    }
    var grand = rows.reduce(function (a, x) { return a + x.totalMs; }, 0);
    setStatus(status, '', T('rep.found', { n: rows.length }) + ' · ' + T('rep.grandTotal', { time: WTT.fmtMs(grand) }));
    rows.forEach(function (row) {
      var card = h('section', { class: 'card inner' }, [
        h('div', { class: 'row-between' }, [
          h('h3', { class: 'no-margin', text: row.name }),
          h('div', { class: 'status no-margin' }, [T('rep.totalInRange') + ': ', h('strong', { text: WTT.fmtMs(row.totalMs) })])
        ])
      ]);
      if (row.sessions.length) {
        var tb = h('tbody');
        row.sessions.forEach(function (s) {
          tb.appendChild(h('tr', {}, [
            td(T('col.task'), s.taskTitle), td(T('col.start'), WTT.fmtDateTime(s.startTime)), td(T('col.end'), WTT.fmtDateTime(s.endTime)),
            td(T('rep.inRange'), WTT.fmtMs(s.overlapMs)), td(T('col.status'), statusPill(s.status))
          ]));
        });
        card.appendChild(h('div', { class: 'table-wrap' }, [h('table', { class: 'stack' }, [h('thead', {}, [h('tr', {}, [th('col.task'), th('col.start'), th('col.end'), th('rep.inRange'), th('col.status')])]), tb])]));
      } else {
        card.appendChild(h('div', { class: 'status', text: T('rep.noSessions') }));
      }
      if (row.tasksCreatedInRange && row.tasksCreatedInRange.length) {
        card.appendChild(h('h4', { text: T('rep.tasksCreated') }));
        var tb2 = h('tbody');
        row.tasksCreatedInRange.forEach(function (tk) {
          tb2.appendChild(h('tr', {}, [td(T('col.task'), tk.title), td(T('col.status'), statusPill(tk.status)), td(T('details.created'), WTT.fmtDateTime(tk.createdAt)), td(T('details.closed'), WTT.fmtDateTime(tk.completedAt))]));
        });
        card.appendChild(h('div', { class: 'table-wrap' }, [h('table', { class: 'stack' }, [h('thead', {}, [h('tr', {}, [th('col.task'), th('col.status'), th('details.created'), th('details.closed')])]), tb2])]));
      }
      content.appendChild(card);
    });
  }

  // ---------- CSV export (built on the server from the same report logic) ----------
  $('#btn-csv').addEventListener('click', function () {
    if (!S.report) return;
    var btn = $('#btn-csv'), status = $('#report-status');
    btn.disabled = true;
    setStatus(status, '', T('rep.exporting'));
    call('api_exportReportCsv', S.report.from, S.report.to, $('#report-employee').value, WTT.lang()).then(function (res) {
      S.lastCsv = res.csv;
      $('#csv-text').value = res.csv;
      $('#csv-fallback').hidden = false;
      try {
        var blob = new Blob([res.csv], { type: 'text/csv;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = h('a', { href: url, download: res.filename, style: 'display:none' });
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
        setStatus(status, 'ok', T('rep.exported', { name: res.filename, n: res.rows }));
      } catch (e) {
        setStatus(status, 'warn', T('rep.exportManual', { name: res.filename }));
      }
    }).catch(function (err) { setStatus(status, 'error', err.message); }).then(function () { btn.disabled = false; });
  });

  // ---------- Language ----------
  WTT.onChange(function () {
    renderEmailInfo();
    renderEmployees();
    populateReportEmployees();
    renderDashboard();
    renderDetails();
    if (S.report) renderReport();
  });

  function boot(urlLang) {
    WTT.init(urlLang);
    call('api_getAppInfo').then(function (info) { S.info = info; renderEmailInfo(); }).catch(function () { /* optional */ });
    loadEmployees();
    loadDashboard();
  }
