<style>
  :root {

  .notice { font-size: 13px; background: #e8efff; border: 1px solid #bcd0ff; color: #1e3a8a; border-radius: 8px; padding: 8px 12px; }

  button.danger { background: var(--danger); color: #fff; }

  /* ---------- dashboard ---------- */

  .chart { display: flex; align-items: flex-end; gap: 6px; height: 190px; overflow-x: auto; padding: 4px 0 0; }

  .bar-val { font-size: 10px; color: var(--muted); height: 14px; font-variant-numeric: tabular-nums; }
  .bar-track { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--border); }
  .bar { width: 70%; max-width: 40px; background: var(--accent); border-radius: 4px 4px 0 0; }

  .donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }

  .donut-hole { position: absolute; inset: 24px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
  .legend { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 160px; }
  .legend li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .legend-name { flex: 1; overflow-wrap: anywhere; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .bars { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .bars li { display: grid; grid-template-columns: 120px 1fr 32px; gap: 10px; align-items: center; }
  .bars li.bar-total { grid-template-columns: 1fr auto; border-top: 1px solid var(--border); padding-top: 8px; font-size: 14px; }
  .hbar { background: #eef2f7; border-radius: 999px; height: 10px; overflow: hidden; }
  .hbar-fill { display: block; height: 100%; border-radius: 999px; background: #94a3b8; }
  .hbar-fill.ts-in_progress, .hbar-fill.ts-completed { background: #10b981; } .hbar-fill.ts-assigned { background: #3b82f6; }
  .hbar-fill.ts-paused { background: #f59e0b; } .hbar-fill.ts-available { background: #8b5cf6; }
  .bar-count { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .feed { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .feed > li { border-bottom: 1px solid #eef2f7; padding-bottom: 8px; font-size: 14px; }
  .feed > li:last-child { border-bottom: 0; }
  .task-ref { font-style: normal; overflow-wrap: anywhere; }
  .comment-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
  .comment-text { margin: 4px 0 0 30px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment.manager .comment-text { background: #f1f5f9; border-radius: 8px; padding: 6px 10px; margin-left: 30px; }
  .comment-form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-top: 12px; }

  /* ---------- tables, badges, tasks ---------- */
  .table-wrap { overflow-x: auto; max-width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #e8edf4; vertical-align: middle; overflow-wrap: break-word; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  td button { white-space: nowrap; }
  tbody tr:hover { background: #f8fafc; }

  .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .chip { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 12px; background: #eef2f7; color: #334155; }
  .pill.ts-in_progress, .pill.ss-active, .pill.st-working, .pill.inv-ok, .pill.ts-completed, .pill.ss-completed { background: #d1fae5; color: #065f46; }
  .pill.ts-paused, .pill.ss-paused, .pill.st-paused, .pill.inv-warn { background: #fef3c7; color: #92400e; }
  .pill.ts-assigned { background: #dbeafe; color: #1e40af; }
  .pill.ts-available { background: #ede9fe; color: #5b21b6; }
  .pill.ts-draft, .pill.ts-replaced, .pill.st-idle, .pill.inv-none, .pill.ss-none { background: #e2e8f0; color: #334155; }
  .pill.inv-bad, .pill.pr-overdue, .pill.pr-high { background: #fee2e2; color: #991b1b; }
  .pill.pr-medium { background: #fef3c7; color: #92400e; }
  .pill.pr-low { background: #e0f2fe; color: #075985; }
  .due { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .due.overdue > span:first-child { color: var(--danger); font-weight: 700; }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 8px 0; }
  dl.facts dt { color: var(--muted); font-size: 13px; }
  dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  dl.facts.big dd { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .link-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .link-input { flex: 1 1 280px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .desc { color: var(--muted); margin: 6px 0; overflow-wrap: anywhere; }
  .task-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .task-card { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px solid var(--border); border-left: 4px solid #cbd5e1; border-radius: 10px; padding: 12px 14px; background: #fff; }
  .task-card.running { border-left-color: #10b981; background: #f6fffb; }
  .task-card.overdue { border-left-color: var(--danger); }
  .task-info { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .task-title-row { overflow-wrap: anywhere; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .task-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .task-big { font-size: 22px; font-weight: 700; overflow-wrap: anywhere; margin: 4px 0 8px; }
  .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
  .timer-display { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .greeting { margin: 4px 0 6px; }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) { .cols, .cols.cols-wide { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 960px) {
    .sidebar { position: fixed; left: 0; top: 0; z-index: 40; transform: translateX(-105%); transition: transform .2s ease; box-shadow: 4px 0 24px rgba(0, 0, 0, .3); }
    .sidebar.open { transform: none; }
    .menu-btn { display: inline-flex; }
    .topbar { padding: 14px 16px 4px; }
    .content-pad { padding: 8px 16px 0; }
    .content { padding: 8px 16px 24px; }
    .footer { padding: 12px 16px 20px; }
  }
  @media (max-width: 700px) {
    body { font-size: 14px; }
    h1 { font-size: 19px; }
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .metric { flex-direction: column; align-items: flex-start; gap: 8px; }
    .timer-display { font-size: 36px; }
    .bars li { grid-template-columns: 96px 1fr 28px; }
    .comment-text, .comment.manager .comment-text { margin-left: 0; }
  }
  /* Tables become stacked cards before they can overflow (the Tasks table has eight columns). */
  @media (max-width: 1100px) {
    table.stack thead { position: absolute; left: -9999px; }
    table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
    table.stack tr { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; padding: 4px 0; background: #fff; }
    table.stack td { border: 0; padding: 4px 12px; display: flex; gap: 10px; justify-content: space-between; text-align: right; align-items: center; }
    table.stack td::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-align: left; flex: none; }
    table.stack td[data-label=""]::before { content: none; }
    table.stack td[data-label=""] { justify-content: flex-end; }
    dl.facts { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
