<style>
  :root {
    --fg: #111827;
    --bg: #f3f4f6;
    --card: #ffffff;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --warn: #d97706;
    --danger: #dc2626;
    --ok: #059669;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.4;
  }
  header { background: #fff; border-bottom: 1px solid var(--border); }
  .container { max-width: 1080px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 16px 0 8px; }
  .notice { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .banner { font-size: 13px; background: #fffbeb; border: 1px solid #f59e0b; color: #78350f; border-radius: 8px; padding: 8px 12px; margin-top: 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin: 12px 0; }
  .tabs { display: flex; gap: 4px; margin: 12px 0; }
  .tab { background: #e5e7eb; border: none; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--fg); }
  .tab.active { background: var(--accent); color: var(--accent-fg); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  form .row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  label { display: flex; flex-direction: column; font-size: 12px; flex: 1 1 180px; color: var(--muted); gap: 4px; }
  input, select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; color: var(--fg); background: #fff;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 8px 14px; border: none; background: var(--accent); color: var(--accent-fg);
    border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  button.primary { background: var(--accent); }
  button.warn { background: var(--warn); }
  button.danger { background: var(--danger); }
  button.secondary { background: #e5e7eb; color: var(--fg); }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  th { background: #f9fafb; font-weight: 600; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .timer-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin: 8px 0 4px; }
  .timer-display { font-size: 44px; font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0.02em; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .link { color: var(--accent); text-decoration: underline; word-break: break-all; }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #e5e7eb; font-size: 11px; color: var(--fg); }
  .pill.active { background: #d1fae5; color: #065f46; }
  .pill.paused { background: #fef3c7; color: #92400e; }
  .pill.completed { background: #dbeafe; color: #1e40af; }
  .pill.replaced { background: #e5e7eb; color: #374151; }
  .flex { display: flex; }
  .row-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  @media (max-width: 480px) {
    .timer-display { font-size: 32px; }
    h1 { font-size: 18px; }
    th, td { font-size: 12px; padding: 6px; }
  }
</style>
